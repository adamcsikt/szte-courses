name: uni-infra

networks:
  public-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24

  private-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24

services:
  nginx:
    image: nginx:1.31.6-alpine
    container_name: uni-infra-nginx-proxy
    networks:
      public-network:
        ipv4_address: 172.28.1.10
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - uni_infra_nginx_logs:/var/log/nginx
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M

  postgres:
    image: postgres:18.3-alpine3.23
    container_name: uni-infra-postgres-database
    networks:
      private-network:
        ipv4_address: 172.28.2.10
    restart: unless-stopped
    env_file:
      - ./infra/environments/postgres.env
    volumes:
      - uni_infra_postgres_data:/var/lib/postgresql/
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    container_name: uni-infra-pgadmin
    networks:
      public-network:
        ipv4_address: 172.28.1.11
      private-network:
        ipv4_address: 172.28.2.11
    restart: unless-stopped
    env_file:
      - ./infra/environments/pgadmin.env
    volumes:
      - uni_infra_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192m

volumes:
  uni_infra_postgres_data:
  uni_infra_pgadmin_data:
  uni_infra_nginx_logs:
